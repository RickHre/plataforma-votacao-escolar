services:
  backend:
    build: .
    container_name: votacao_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/votacao_escolar.db
      SECRET: ultra-secret-and-secure-key
    volumes:
      - ./app:/app/app:Z
      - ./data:/data:Z
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./web
    container_name: votacao_frontend
    ports:
      # - "80:80"
      - "8080:80"
    depends_on:
      - backend
    restart: always
